<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Metadata configuration and character encoding -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Transcript Extractor</title>
    <!-- Google Fonts preconnect and import for typography styling -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Source+Serif+4:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* CSS Custom Properties for theme colors and typography fonts */
        :root {
            --paper: #eef1f6;
            --ink: #14213d;
            --muted: #5b6785;
            --line: #d5dbe8;
            --panel: #ffffff;
            --signal: #e5252a;
            --signal-dark: #b81a1f;
            --soft-red: #fdecec;
            --display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
            --reading: 'Source Serif 4', Georgia, 'Times New Roman', serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { -webkit-text-size-adjust: 100%; }
        /* Main page layout and background styling */
        body {
            background: var(--paper);
            color: var(--ink);
            font-family: var(--display);
            min-height: 100vh;
            padding: clamp(20px, 6vw, 72px) 20px;
            background-image: radial-gradient(circle at 1px 1px, #cfd6e6 1px, transparent 0);
            background-size: 22px 22px;
        }
        .wrap { max-width: 760px; margin: 0 auto; }

        header { margin-bottom: 32px; }
        h1 {
            font-size: clamp(2.2rem, 7vw, 3.6rem);
            font-weight: 800;
            line-height: 1.02;
            letter-spacing: -0.03em;
        }
        .lead {
            margin-top: 14px;
            color: var(--muted);
            font-size: 1.05rem;
            max-width: 46ch;
            line-height: 1.5;
        }

        /* Input search bar styling */
        .bar {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--panel);
            border: 2px solid var(--ink);
            border-radius: 14px;
            padding: 8px;
            box-shadow: 6px 6px 0 var(--ink);
            transition: box-shadow .15s, transform .15s;
        }
        .bar:focus-within { box-shadow: 3px 3px 0 var(--signal); border-color: var(--signal); transform: translate(3px, 3px); }
        .bar input {
            flex: 1;
            min-width: 0;
            border: none;
            outline: none;
            background: transparent;
            font: 500 1.05rem var(--display);
            color: var(--ink);
            padding: 12px 14px;
        }
        .bar input::placeholder { color: #8a94ae; }
        /* Submit button styling */
        .btn {
            font: 700 1rem var(--display);
            border: none;
            border-radius: 9px;
            padding: 13px 24px;
            cursor: pointer;
            background: var(--signal);
            color: #fff;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background .15s;
            white-space: nowrap;
        }
        .btn:hover { background: var(--signal-dark); }
        .btn:focus-visible, .tool:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
        .btn[disabled] { opacity: .75; cursor: progress; }
        /* Loading spinner animation */
        .spinner {
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,.45);
            border-top-color: #fff;
            border-radius: 50%;
            display: none;
            animation: spin .7s linear infinite;
        }
        .btn.loading .spinner { display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hint { margin-top: 14px; color: var(--muted); font-size: .92rem; }

        /* Error alert box styling */
        .error {
            margin-top: 26px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            background: var(--soft-red);
            border: 1px solid #f4b9bb;
            border-left: 5px solid var(--signal);
            color: #8f1418;
            padding: 14px 16px;
            border-radius: 10px;
            line-height: 1.45;
        }

        /* Result container styling */
        .result {
            margin-top: 34px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 14px;
            overflow: hidden;
            animation: rise .45s ease-out both;
        }
        @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--line);
            background: #f7f9fc;
        }
        .toolbar h2 { font-size: 1.05rem; font-weight: 700; }
        .stats { color: var(--muted); font-size: .88rem; margin-top: 2px; }
        .actions { display: flex; gap: 8px; }
        /* Action buttons for copying and downloading text */
        .tool {
            font: 600 .9rem var(--display);
            background: var(--panel);
            color: var(--ink);
            border: 1.5px solid var(--ink);
            border-radius: 8px;
            padding: 8px 14px;
            cursor: pointer;
            transition: background .15s, color .15s;
        }
        .tool:hover { background: var(--ink); color: #fff; }
        .tool.done { background: #1f7a4d; border-color: #1f7a4d; color: #fff; }
        /* Textarea displaying the fetched transcript text */
        textarea {
            display: block;
            width: 100%;
            height: 380px;
            border: none;
            outline: none;
            resize: vertical;
            padding: 20px 22px;
            font-family: var(--reading);
            font-size: 1.08rem;
            line-height: 1.75;
            color: #1d2a48;
            background: var(--panel);
        }

        @media (max-width: 520px) {
            .bar { flex-direction: column; align-items: stretch; box-shadow: 4px 4px 0 var(--ink); }
            .btn { justify-content: center; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>
    <main class="wrap">
        <header>
            <h1>YouTube video transcript</h1>
            <p class="lead">Enter youtube video ID</p>
        </header>

        <!-- Form to accept YouTube video ID or full URL -->
        <form method="POST" id="form">
            <div class="bar">
                <input
                    type="text"
                    id="video_id"
                    name="video_id"
                    value="{{ request.form.video_id or '' }}"
                    placeholder="enter youtube video id eg: abiL84EAWSY"
                    aria-label="YouTube link ya Video ID"
                    autocomplete="off"
                    required>
                <button type="submit" class="btn" id="submitBtn">
                    <span class="spinner" aria-hidden="true"></span>
                    <span id="btnText">Get transcript</span>
                </button>
            </div>
            <p class="hint">if you paste youtube video url it auto detect youtube video id</p>
        </form>

        <!-- Display error message if any occurs -->
        {% if error %}
            <div class="error" role="alert">{{ error }}</div>
        {% endif %}

        <!-- Display result section containing transcript text and action tools -->
        {% if transcript %}
            <section class="result" aria-labelledby="result-title">
                <div class="toolbar">
                    <div>
                        <h2 id="result-title">Transcript</h2>
                        <p class="stats" id="stats"></p>
                    </div>
                    <div class="actions">
                        <button type="button" class="tool" id="copyBtn">Copy text</button>
                        <button type="button" class="tool" id="downloadBtn">Download .txt</button>
                    </div>
                </div>
                <textarea id="transcript" readonly>{{ transcript }}</textarea>
            </section>
        {% endif %}
    </main>

    <script>
        // Automatically extract the clean video ID when a full YouTube link is pasted
        const input = document.getElementById('video_id');
        function extractId(value) {
            const v = value.trim();
            const m = v.match(/(?:v=|youtu\.be\/|embed\/|shorts\/|live\/)([A-Za-z0-9_-]{11})/);
            return m ? m[1] : v;
        }
        input.addEventListener('input', () => {
            if (input.value.includes('/') || input.value.includes('=')) {
                input.value = extractId(input.value);
            }
        });

        // Handle form submission and update button state to loading
        const form = document.getElementById('form');
        const btn = document.getElementById('submitBtn');
        form.addEventListener('submit', () => {
            input.value = extractId(input.value);
            btn.classList.add('loading');
            btn.disabled = true;
            document.getElementById('btnText').textContent = 'Fetching...';
        });

        // Calculate reading stats and handle copy/download utilities
        const box = document.getElementById('transcript');
        if (box) {
            const words = box.value.trim().split(/\s+/).filter(Boolean).length;
            const mins = Math.max(1, Math.round(words / 200));
            document.getElementById('stats').textContent =
                words.toLocaleString() + ' words, approx ' + mins + ' min read';

            const copyBtn = document.getElementById('copyBtn');
            copyBtn.addEventListener('click', async () => {
                try {
                    await navigator.clipboard.writeText(box.value);
                } catch (e) {
                    box.select();
                    document.execCommand('copy');
                }
                copyBtn.textContent = 'Copied';
                copyBtn.classList.add('done');
                setTimeout(() => {
                    copyBtn.textContent = 'Copy text';
                    copyBtn.classList.remove('done');
                }, 1800);
            });

            document.getElementById('downloadBtn').addEventListener('click', () => {
                const blob = new Blob([box.value], { type: 'text/plain;charset=utf-8' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = (input.value || 'transcript') + '.txt';
                a.click();
                URL.revokeObjectURL(a.href);
            });
        }
    </script>
</body>
</html>
